# Render blueprint for the API.
#
# In the Render dashboard: New → Blueprint → pick this repo. Render reads this
# file, builds the existing Dockerfile and creates the service. Three values are
# marked `sync: false`, which means Render will not read them from here — you
# paste them in the dashboard, so they never live in git.
#
# The free plan idles a service down after 15 minutes. 750 free instance-hours
# covers a 744-hour month, so pointing a free uptime pinger at /healthz every
# 10 minutes keeps it awake permanently and still costs nothing.

services:
  - type: web
    name: plotting-society-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore          # the closest Render region to India
    healthCheckPath: /healthz
    autoDeploy: true

    # Only redeploy when something the API is built from actually changes.
    # Without this, a front-end or docs commit rebuilds the same Go binary and,
    # on the free plan, takes the service down for a minute to do it.
    buildFilter:
      ignoredPaths:
        - web/**
        - docs/**
        - README.md
        - LICENSE
        - test/**
        - "**/*_test.go"
    envVars:
      - key: APP_ENV
        value: production

      # Render injects PORT and main.go honours it over HTTP_ADDR.

      # Supabase → Settings → Database → Connection string → URI.
      # Use the POOLER URI on port 6543, not the direct one: a free Postgres
      # has a low connection cap and the pooler is what absorbs restarts.
      - key: DATABASE_URL
        sync: false

      # Render generates 32+ random characters and stores them. Never set this
      # by hand and never commit it.
      - key: JWT_SECRET
        generateValue: true

      # Your Cloudflare Pages URL, e.g. https://plotting-society.pages.dev
      # PUBLIC_BASE_URL is where invite links point; CORS_ORIGINS is the only
      # origin the API will answer cross-origin requests from.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 720h

      # Photo uploads. Supabase Storage speaks the S3 API, so the signer in
      # internal/media works against it unchanged. Fill these in from
      # Supabase → Storage → S3 access keys once a bucket exists; leave them
      # blank and the upload route returns a clear 503 instead of failing oddly.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
