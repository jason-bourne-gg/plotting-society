# Local stack: Postgres and an S3-compatible bucket. Nothing here needs an
# account anywhere, so the whole app runs on a laptop with no signups.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plot
      POSTGRES_PASSWORD: plot
      POSTGRES_DB: plotting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plot -d plotting"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stands in for Cloudflare R2. Same S3 API, so the signing code is identical
  # in development and production.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket and makes it publicly readable, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/plotting-media &&
      mc anonymous set download local/plotting-media &&
      echo 'bucket ready'
      "

volumes:
  pgdata:
  miniodata:
